env_type: robosimstudio

# RoboSimStudio task configuration
task_name: "examples/crate_wash/flip"  # Task in format "suite/variant"

total_num_envs: null

auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 500
max_episode_steps: 500  # max episode steps for truncation

use_rel_reward: True
reward_coef: 1.0

# RLinf RoboSimStudioEnv specific settings
seed: 0
group_size: 1
use_fixed_reset_state_ids: True

# RoboSimStudio rendering settings
renderer: ""  # Options: "", "gl", "rtx", "pyrender"
render_every: 1
max_steps: 500

# Camera configuration
main_camera: "camera_0"  # Main camera name in RoboSimStudio task
wrist_camera: ""  # Optional wrist camera name

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  camera_heights: 256
  camera_widths: 256
